[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "venv", "build", "dist", "resources", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# main.py inserts the project root on sys.path before importing backend modules.
"backend/main.py" = ["E402"]
